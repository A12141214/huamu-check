    </div>

  <div id="out"></div>

  <footer>

    需要 AI 改写（逐条说明 + 合规改写稿）请用 Streamlit 版；本页只做规则体检。<br>
    规则与 <code>rules.json</code> 同源，由 <code>build_static.py</code> 生成，改规则后需重新生成。
  </footer>
</div>

son": "“永不凋谢”“花期最长”属于无法验证的极致化表述，鲜花园艺直播红黑榜将其列为“绝对化/夸大”高危话术。鲜切花和活体植物的花期均有自然极限。", "source": "鲜花园艺直播红黑榜 2026-06-20"}, {"id": "R009", "category": "C", "platform": ["all"], "pattern": "(五彩月季|红粉蓝莓|中国红玉兰|郁金香玉兰|牡丹玉兰|七彩(月季|玫瑰|茶花|杜鹃|草莓)|纯蓝色(玫瑰|火龙果)|蓝色(火龙果|西瓜)|绿色(草莓|玫瑰)|蓝桂苗)", "risk": "极高", "reason": "上述品种均为抖音公告中明确列出的“不存在的虚构品种”案例。平台禁止虚构自然界不存在的物种或品种，要求准确宣传苗木的标准官方品种名。使用AI生成或自行编造的品种名，同样属于虚构品种。", "source": "抖音专项治理公告 2026-04-30（品种产地虚假—虚构品种）/ 2026-09-02 / 鲜花园艺行业禁售商品细则"}, {"id": "R010", "category": "C", "platform": ["all"], "pattern": "(进口品种|进口苗木|原装进口|国外原种|进口原种)", "risk": "中", "reason": "宣称“进口品种/进口苗木”属于需要提供真实来源证明的资质类表述。无实际进口凭证却宣传进口，构成对品种来源的虚假描述。", "source": "鲜花园艺直播红黑榜 2026-06-20"}, {"id": "R011", "category": "C", "platform": ["all"], "pattern": "(扦插|嫁接).{0,20}(种子|播种)|(种子|播种).{0,20}(扦插|嫁接)", "risk": "高", "reason": "部分物种依靠扦插/嫁接繁殖，宣传以通过种子播种种植，需如实宣传植物繁育方式，不胡乱宣传、刻意隐瞒。", "source": "抖音专项治理公告 2026-04-30（品种产地虚假）"}, {"id": "R012", "category": "C", "platform": ["all"], "pattern": "(自花授粉|无需授粉|单株结果).{0,20}(无需|不用|不需要).{0,10}(授粉|配树)|(异花授粉).{0,20}(自花授粉|单株结果)", "risk": "高", "reason": "部分品种授粉方式是异花授粉，虚假宣传为自花授粉，导致消费者单株种植后无法正常结果。", "source": "抖音专项治理公告 2026-04-30（品种产地虚假）"}, {"id": "R013", "category": "D", "platform": ["all"], "pattern": "(主图|详情页|讲解|展示).{0,20}(成熟|长成|成品).{0,10}(树|苗|株)|(成熟株|成熟苗).{0,10}(替代|代替).{0,10}(发货|种苗)", "risk": "高", "reason": "商品主图/详情页展示为成熟树苗，但实际发货为种苗；直播和视频讲解仅可讲解实际发货种苗，避免用成熟苗情讲解。", "source": "抖音专项治理公告 2026-04-30（商品信息不规范）"}, {"id": "R014", "category": "D", "platform": ["all"], "pattern": "(AI|P图|合成|修图).{0,20}(果实密度|枝叶|开花|果实|花苞)|(不符合|超出).{0,10}(物种|品种).{0,10}(生长规律|特性|实际)", "risk": "高", "reason": "禁止使用AI技术/P图制作不符合物种本身生长规律的果实密度/枝叶宣传，可能产生引人误解的营销推广行为。AI生成内容需与实际商品信息一致，并进行人工确认。", "source": "抖音《关于鲜花绿植宣传与经营规范专项治理公告》2026-04-30"}, {"id": "R015", "category": "D", "platform": ["all"], "pattern": "(胶水|铁丝|绑|固定|拼接|插).{0,10}(果子|花朵|花苞|果实)", "risk": "高", "reason": "通过用胶水铁丝绑果子等仿真样品方式，虚构植物真实形态，拉高用户预期。", "source": "抖音专项治理公告 2026-04-30（商品信息不规范）"}, {"id": "R016", "category": "D", "platform": ["all"], "pattern": "( const RISK_ORDER = {"极高":0,"高":1,"中":2,"低":3};
const SAMPLE = "家人们看这棵桂花，四季开花，养死包赔，全网最低价，喜欢的赶紧下单！";

// 预编译正则；同时按风险排序，保证“极高”永远在最上面
const RULES = DATA.rules.map((r,i)=>({...r, re:new RegExp(r.pattern,"g"), idx:i}))
  .sort((a,b)=>(RISK_ORDER[a.risk]??9)-(RISK_ORDER[b.risk]??9) || a.idx-b.idx);

let PLATFORM="all";
function activeRules(){
  return RULES.filter(r=>{
    const ps = r.platform && r.platform.length ? r.platform : ["all"];
    return PLATFORM==="all" ? ps.includes("all") : (ps.includes("all")||ps.includes(PLATFORM));
  });
}

function lint(text){
  const hits=[];
  for(const rule of activeRules()){
    rule.re.lastIndex=0;
    let m;
    while((m=rule.re.exec(text))!==null){
      if(m[0].length===0){ rule.re.lastIndex++; continue; }
      hits.push({id:rule.id,category:rule.category,risk:rule.risk,reason:rule.reason,source:rule.source,
                 matched:m[0],start:m.index,end:m.index+m[0].length});
    }
  }
  hits.sort((a,b)=>(RISK_ORDER[a.risk]??9)-(RISK_ORDER[b.risk]??9) || a.start-b.start);
  return hits;
}

// 命中的词去替换表里找说法：先精确、再包含、再按分组关键词
function suggest(matched){
  for(const group of Object.values(DATA.replacements)){
    if(Object.prototype.hasOwnProperty.call(group, matched)) return group[matched];
  }
  for(const group of Object.values(DATA.replacements)){
    for(const key of Object.keys(group)){
      if(key.length>=2 && (matched.includes(key) || key.includes(matched))) return group[key];
    }
  }
  return null;
}

function highlight(text,hits){
  const spans=[...new Set(hits.map(h=>h.start+"-"+h.end))]
    .map(s=>s.split("-").map(Number)).sort((a,b)=>a[0]-b[0]);
  const merged=[];
  for(const [s,e] of spans){
    if(merged.length && s<=merged[merged.length-1][1]) merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],e);
    else merged.push([s,e]);
  }
  let out="",cur=0;
  for(const [s,e] of merged){
    out+=esc(text.slice(cur,s))+"<mark>"+esc(text.slice(s,e))+"</mark>";
    cur=e;
  }
  return out+esc(text.slice(cur));
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function render(text){
  const out=document.getElementById("out");
  const hits=lint(text);
  if(!text.trim()){ out.innerHTML=""; return; }

  if(!hits.length){
    out.innerHTML=`<div class="stats"><div class="stat"><b>0</b><span>命中条数</span></div></div>
      <div class="verdict ok">未命中硬规则 ✅　规则库未覆盖的语义风险仍需人工确认。</div>
      <div class="card" style="margin-top:16px"><div class="copy">${esc(text)}</div></div>`;
    return;
  }

  const top=hits[0].risk;
  const cards=hits.map(h=>{
    const sg=suggest(h.matched);
    const cat=DATA.categories[h.category]||"";
    return `<div class="hit">
      <h3><span class="tag ${RISK_CLASS[h.risk]||"mid"}">${h.risk}</span>
          ${h.id}${cat?` · ${esc(cat)}`:""} · 命中「${esc(h.matched)}」</h3>
      <p>${esc(h.reason)}</p>
      <p class="src">依据：${esc(h.source)}</p>
      ${sg?`<div class="sug"><b>合规说法：</b>${esc(sg)}</div>`:""}
    </div>`;
  }).join("");

  out.innerHTML=`<div class="stats">
      <div class="stat"><b>${hits.length}</b><span>命中条数</span></div>
      <div class="stat"><b>${top}</b><span>最高风险</span></div>
      <div class="stat"><b>${activeRules().length}</b><span>生效规则</span></div>
    </div>
    <div class="verdict bad">发现 ${hits.length} 处可能违规，发布前请逐条核对。</div>
    <div class="card" style="margin-top:16px"><div class="copy">${highlight(text,hits)}</div></div>
    ${cards}`;
}

document.getElementById("run").onclick=()=>{
  const t=document.getElementById("txt").value;
  if(!t.trim()){ alert("请先粘贴一段文案"); return; }
  render(t);
  document.getElementById("out").scrollIntoView({behavior:"smooth",block:"start"});
};
document.getElementById("demo").onclick=()=>{
  document.getElementById("txt").value=SAMPLE; render(SAMPLE);
};
document.getElementById("clear").onclick=()=>{
  document.getElementById("txt").value=""; document.getElementById("out").innerHTML="";
  document.getElementById("txt").focus();
};
const platSel=document.getElementById("plat");
for(const [code,name] of Object.entries(DATA.platforms||{})){
  const o=document.createElement("option"); o.value=code; o.textContent=name; platSel.appendChild(o);
}
platSel.value="all";
platSel.onchange=()=>{ PLATFORM=platSel.value; const t=document.getElementById("txt").value; render(t); };

document.getElementById("txt").addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter") document.getElementById("run").click();
});
</script>
